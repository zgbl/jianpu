<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>谱间 · 音乐工作台</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="home.css"></head>
<body>
 <header class="workspace-header">
  <a class="workspace-brand" href="/" aria-label="谱间主页"><span>谱</span>谱间<small>音乐工作台</small></a>
  <nav aria-label="工作方式"><button id="tabTranscribe" aria-selected="true">听歌识谱</button><button id="tabImage">本机图片识谱</button><button id="tabModelImage">大模型读谱导入</button><button id="tabCompare">双谱校对</button><button id="tabAudioDebug">音频调试</button></nav>
  <span class="workspace-purpose">听歌识别 · 原地编辑 · 对照校准</span>
  <span class="local-label">音频留在本机</span>
 </header>
 <section class="project-bar" aria-label="工程操作"><div class="project-identity"><strong id="projectName">歌曲工程</strong><span id="projectStatus" role="status">正在加载工程…</span></div><div class="project-actions"><button id="projectNew">新建工程</button><button id="projectOpen">打开 / 最近工程</button><button id="projectHistory" hidden>修订版本</button><button id="projectSaveAs">另存为</button><button id="projectSave" class="primary">保存工程</button></div></section>
 <main>
  <section id="transcribePanel"><iframe id="transcribeFrame" title="歌曲识别与简谱编辑工作台" allow="autoplay; display-capture"></iframe></section>
  <section id="scoreImagePanel" hidden><iframe id="scoreImageFrame" title="图片简谱识别与导入"></iframe></section>
  <section id="modelImagePanel" hidden><iframe id="modelImageFrame" title="视觉大模型 JPU 转换与导入"></iframe></section>
 <section id="comparePanel" hidden><iframe id="compareFrame" title="音频与视觉双谱校对" allow="autoplay"></iframe></section><section id="audioDebugPanel" hidden><iframe id="audioDebugFrame" title="音频识别调试工作台" allow="autoplay"></iframe></section></main>
 <input id="projectFile" type="file" accept=".jpp,application/zip" hidden>
 <dialog id="newProjectDialog"><form id="newProjectForm"><h2>新建歌曲工程</h2><label>工程名称<input id="newProjectName" value="未命名工程" maxlength="200" required></label><label>从哪里开始<select id="newProjectStage"><option value="transcribe">导入歌曲，听歌识别</option><option value="editor">空白简谱，直接编辑</option></select></label><div class="dialog-actions"><button type="button" data-close-project="newProjectDialog">取消</button><button type="submit" class="primary">创建工程</button></div></form></dialog>
 <dialog id="openProjectDialog"><h2>打开歌曲工程</h2><p>工程包含原曲、人声、识别结果与修订后的简谱。</p><button id="projectImport" class="primary">打开 .jpp 工程包</button><h3>本机最近工程</h3><div id="recentProjects"></div><details><summary>恢复改版前的识别任务</summary><div id="legacyProjects"></div><button id="legacyRefresh">查找旧识别</button></details><div class="dialog-actions"><button data-close-project="openProjectDialog">关闭</button></div></dialog>
 <dialog id="projectHistoryDialog"><h2>保留的修订版本</h2><p>使用新识别结果前的人工修订会保留在这里。</p><div id="historyProjects"></div><div class="dialog-actions"><button data-close-project="projectHistoryDialog">关闭</button></div></dialog>
 <script type="module" src="src/home.js"></script>
</body></html>
