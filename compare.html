<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双谱校对</title><link rel="stylesheet" href="compare.css"><body>
<header><strong>音频谱 ↔ 视觉谱校对</strong><button id="reload">刷新工程谱源</button><label><input id="sync" type="checkbox" checked>同步滚动</label><label><input id="follow" type="checkbox" checked>播放跟随</label><label><input id="showMarks" type="checkbox">显示差异标记</label><button id="compare">标记差异</button><button id="undo" disabled>撤销确认</button><button id="adopt" disabled>将确认后的视觉谱导入工程</button><span id="status" role="status">正在加载工程</span></header>
<section class="transport"><audio id="audio" controls></audio><label>双谱指针时间校正（秒）<input id="offset" type="number" step=".1" value="0"></label><small id="alignmentInfo" role="status">正在按两谱共同歌词对齐时间；点击音符可定位原歌。</small></section>
<main><section class="side"><h2>音频识别谱 <select id="leftSource"></select><label class="file">加载 JPU<input id="leftFile" type="file" accept=".jpu,.json"></label></h2><div id="left" class="sheet"></div></section><section class="side"><h2>视觉识别谱 <select id="rightSource"></select><label class="file">加载 JPU<input id="rightFile" type="file" accept=".jpu,.json"></label></h2><div id="right" class="sheet"></div></section></main>
<aside><strong>待人工确认的差异</strong><small>标记不会修改谱面。确认只修改右侧比较稿；点击“导入工程”后才替换工程谱，并保留修订版本。</small><div id="reviewWarnings" role="status"></div><div id="issues">请选择两份谱，点击“标记差异”。</div></aside><script type="module" src="src/compare-page.js"></script></body></html>
